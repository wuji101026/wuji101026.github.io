<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>无极的博客</title>
    <style>
        /* ========== CSS 变量（亮色默认） ========== */
        :root {
            --bg-start: #f7f0fc;
            --bg-end: #e9def5;

            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.5);
            --card-shadow: 0 30px 60px -20px rgba(90, 60, 120, 0.25),
                0 8px 20px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            --card-shadow-hover: 0 40px 80px -24px rgba(90, 60, 120, 0.30),
                0 8px 24px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);

            --text-primary: #2d1b3e;
            --text-secondary: #4d3a62;
            --text-muted: #8a75a8;
            --text-light: #9b86b3;
            --text-status: #7b4fa0;

            --dot-1: #c4a0e8;
            --dot-2: #b38bdb;
            --dot-3: #a076cc;

            --badge-start: #c4a0e8;
            --badge-end: #a076cc;
            --badge-shadow: rgba(160, 118, 204, 0.25);

            --divider-start: #c4a0e8;
            --divider-mid: #a076cc;
            --divider-end: #8a5fb5;

            --project-bg: rgba(255, 255, 255, 0.5);
            --project-border: rgba(255, 255, 255, 0.6);
            --project-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            --project-bg-hover: rgba(255, 255, 255, 0.85);
            --project-shadow-hover: 0 8px 24px -8px rgba(90, 60, 120, 0.15);
            --project-icon-start: #e8def5;
            --project-icon-end: #d6c6ea;
            --project-icon-hover-start: #d6c6ea;
            --project-icon-hover-end: #c4a0e8;
            --project-arrow: #b8a2ce;
            --project-arrow-hover: #7b4fa0;
            --project-link-hover: #7b4fa0;

            --footer-border: rgba(196, 160, 232, 0.2);
            --status-dot: #5fc7a7;
            --status-dot-glow: rgba(95, 199, 167, 0.3);

            --email-color: #7b4fa0;
            --email-hover: #5a3a7a;
        }

        /* ========== 暗黑模式 ========== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-start: #120d1a;
                --bg-end: #1e1430;

                --card-bg: rgba(30, 22, 45, 0.82);
                --card-border: rgba(120, 90, 160, 0.25);
                --card-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6),
                    0 8px 20px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.06);
                --card-shadow-hover: 0 40px 80px -24px rgba(0, 0, 0, 0.7),
                    0 8px 24px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.08);

                --text-primary: #ede6f5;
                --text-secondary: #c8bcdb;
                --text-muted: #a894bf;
                --text-light: #8f7aa8;
                --text-status: #bca4d9;

                --dot-1: #a884d0;
                --dot-2: #9373c4;
                --dot-3: #8062b8;

                --badge-start: #a884d0;
                --badge-end: #8062b8;
                --badge-shadow: rgba(128, 98, 184, 0.35);

                --divider-start: #a884d0;
                --divider-mid: #8062b8;
                --divider-end: #6a4f9e;

                --project-bg: rgba(40, 30, 58, 0.6);
                --project-border: rgba(120, 90, 160, 0.2);
                --project-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
                --project-bg-hover: rgba(55, 42, 78, 0.8);
                --project-shadow-hover: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
                --project-icon-start: #2f2245;
                --project-icon-end: #3f2e58;
                --project-icon-hover-start: #3f2e58;
                --project-icon-hover-end: #5a4080;
                --project-arrow: #6a5590;
                --project-arrow-hover: #bca4d9;
                --project-link-hover: #bca4d9;

                --footer-border: rgba(120, 90, 160, 0.2);
                --status-dot: #5fc7a7;
                --status-dot-glow: rgba(95, 199, 167, 0.25);

                --email-color: #bca4d9;
                --email-hover: #d6c6ea;
            }
        }

        /* ========== 全局重置 & 字体 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            padding: 16px;
            margin: 0;
            transition: background 0.4s ease;
        }

        /* ========== 卡片容器 ========== */
        .card {
            max-width: 640px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 32px 32px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            transition: transform 0.3s ease, box-shadow 0.4s ease, background 0.4s ease, border-color 0.4s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        /* ========== 头部装饰 ========== */
        .header-decoration {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.4s ease;
        }
        .dot-1 { background: var(--dot-1); }
        .dot-2 { background: var(--dot-2); }
        .dot-3 { background: var(--dot-3); }

        .header-sub {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            margin-left: 6px;
            transition: color 0.4s ease;
        }

        /* ========== 标题 ========== */
        .title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            transition: color 0.4s ease;
        }

        .title .wave {
            display: inline-block;
            animation: wave 2.4s ease-in-out infinite;
            transform-origin: 70% 70%;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(12deg); }
            50% { transform: rotate(-6deg); }
            75% { transform: rotate(10deg); }
        }

        .title-badge {
            font-size: 13px;
            font-weight: 500;
            background: linear-gradient(135deg, var(--badge-start), var(--badge-end));
            color: #fff;
            padding: 2px 14px;
            border-radius: 100px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px var(--badge-shadow);
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        /* ========== 描述 ========== */
        .description {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-top: 4px;
            margin-bottom: 28px;
            padding-left: 2px;
            font-weight: 400;
            transition: color 0.4s ease;
        }

        .description span {
            background: linear-gradient(120deg, rgba(196, 160, 232, 0.25), rgba(160, 118, 204, 0.15));
            padding: 0 6px;
            border-radius: 4px;
            font-weight: 450;
            transition: background 0.4s ease;
        }
        @media (prefers-color-scheme: dark) {
            .description span {
                background: linear-gradient(120deg, rgba(168, 132, 208, 0.25), rgba(128, 98, 184, 0.15));
            }
        }

        /* ========== 分隔线 ========== */
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--divider-start), var(--divider-mid), var(--divider-end));
            border-radius: 4px;
            margin-bottom: 24px;
            transition: background 0.4s ease;
        }

        /* ========== 项目列表 ========== */
        .project-section {
            margin-top: 4px;
        }

        .project-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 14px;
            transition: color 0.4s ease;
        }

        .project-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .project-list li {
            display: flex;
            align-items: center;
            background: var(--project-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 18px;
            padding: 4px 4px 4px 16px;
            border: 1px solid var(--project-border);
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease, border-color 0.3s ease;
            box-shadow: var(--project-shadow);
        }

        .project-list li:hover {
            background: var(--project-bg-hover);
            box-shadow: var(--project-shadow-hover);
            transform: translateX(4px);
        }

        .project-list li a {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            color: var(--text-primary);
            padding: 10px 0;
            transition: color 0.2s ease;
            min-height: 52px; /* 触摸友好 */
        }

        .project-list li a:hover {
            color: var(--project-link-hover);
        }

        .project-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--project-icon-start), var(--project-icon-end));
            border-radius: 12px;
            font-size: 18px;
            flex-shrink: 0;
            transition: background 0.25s ease, transform 0.2s ease;
        }

        .project-list li:hover .project-icon {
            background: linear-gradient(135deg, var(--project-icon-hover-start), var(--project-icon-hover-end));
            transform: scale(1.04) rotate(-2deg);
        }

        .project-arrow {
            margin-left: auto;
            color: var(--project-arrow);
            font-size: 18px;
            font-weight: 300;
            transition: transform 0.25s ease, color 0.2s ease;
            padding-right: 6px;
        }

        .project-list li:hover .project-arrow {
            transform: translateX(4px) scale(1.1);
            color: var(--project-arrow-hover);
        }

        /* ========== 底部信息（含邮箱） ========== */
        .footer-note {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--footer-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 16px;
            transition: border-color 0.4s ease;
        }

        .footer-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
            font-size: 14px;
            color: var(--text-light);
            transition: color 0.4s ease;
        }

        .footer-left .copyright {
            letter-spacing: 0.2px;
        }

        .footer-left .email-link {
            color: var(--email-color);
            text-decoration: none;
            font-weight: 450;
            transition: color 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0; /* 触摸区域 */
        }

        .footer-left .email-link:hover {
            color: var(--email-hover);
            text-decoration: underline;
        }

        .footer-left .separator {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .footer-note .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-status);
            font-weight: 450;
            transition: color 0.4s ease;
            flex-shrink: 0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--status-dot);
            display: inline-block;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 0 0 var(--status-dot-glow);
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 var(--status-dot-glow); }
            50% { box-shadow: 0 0 0 6px var(--status-dot-glow); }
        }

        /* ========== 响应式 - 手机优先增强 ========== */
        /* 小屏手机 (<= 480px) */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 28px 18px 24px;
                border-radius: 28px;
            }

            .title {
                font-size: 28px;
                gap: 6px;
            }

            .title-badge {
                font-size: 11px;
                padding: 1px 12px;
            }

            .description {
                font-size: 15px;
                margin-bottom: 22px;
            }

            .divider {
                margin-bottom: 20px;
                width: 48px;
            }

            .project-label {
                font-size: 12px;
                margin-bottom: 12px;
            }

            .project-list {
                gap: 8px;
            }

            .project-list li {
                padding: 2px 2px 2px 12px;
                border-radius: 14px;
            }

            .project-list li a {
                font-size: 15px;
                gap: 10px;
                padding: 8px 0;
                min-height: 46px;
            }

            .project-icon {
                width: 32px;
                height: 32px;
                font-size: 16px;
                border-radius: 10px;
            }

            .project-arrow {
                font-size: 16px;
                padding-right: 4px;
            }

            .footer-note {
                margin-top: 22px;
                padding-top: 14px;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .footer-left {
                font-size: 13px;
                gap: 4px 8px;
            }

            .footer-left .email-link {
                font-size: 13px;
            }

            .footer-note .status {
                font-size: 13px;
            }
        }

        /* 超小屏 (<= 380px) */
        @media (max-width: 380px) {
            .card {
                padding: 20px 14px 18px;
                border-radius: 24px;
            }

            .title {
                font-size: 24px;
            }

            .description {
                font-size: 14px;
            }

            .project-list li a {
                font-size: 14px;
                min-height: 42px;
            }

            .project-icon {
                width: 28px;
                height: 28px;
                font-size: 14px;
                border-radius: 8px;
            }

            .footer-left {
                font-size: 12px;
            }
        }

        /* 大屏手机/平板 (481px ~ 600px) 保持过渡 */
        @media (min-width: 481px) and (max-width: 600px) {
            .card {
                padding: 36px 28px 28px;
            }

            .title {
                font-size: 32px;
            }

            .description {
                font-size: 16px;
            }

            .project-list li a {
                font-size: 16px;
            }
        }

        /* 桌面触摸优化 (指针: coarse) 比如平板 */
        @media (pointer: coarse) {
            .project-list li a {
                min-height: 48px;
            }
            .footer-left .email-link {
                padding: 6px 0;
            }
        }
    </style>
</head>
<body>

            <span class="dot dot-2"></span>

        <!-- ====== 底部 ====== -->
        <div class="footer-note">

                <a href="mailto:1415789411@qq.com" class="email-link">
                    1415789411@qq.com
                </a>
                <a href="mailto:q962464_0727@qq.com" class="email-link">
                    q962464_0727@qq.com
                </a>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                在线
            </div>
        </div>

    </div>

</body>
</html>
