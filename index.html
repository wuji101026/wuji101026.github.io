<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>无极 · 博客</title>
    <meta name="description" content="无极的个人博客：前端开发、交互设计、动效与离线小工具的作品与记录。" />
    <meta name="theme-color" content="#08070d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1fb" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="无极 · 博客" />
    <meta property="og:description" content="前端开发、交互设计、动效与离线小工具的作品与记录。" />
    <meta property="og:url" content="https://wuji101026.github.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="无极 · 博客" />
    <meta name="twitter:description" content="前端开发、交互设计、动效与离线小工具的作品与记录。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8C%8C%3C/text%3E%3C/svg%3E" />
    <style>
        /* ========== 主题变量 ========== */
        :root,
        [data-theme="dark"] {
            color-scheme: dark;
            --nav-h: 68px;
            --bg: #08070d;
            --bg-soft: #0e0c16;
            --panel: rgba(255, 255, 255, 0.04);
            --panel-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.10);
            --border-strong: rgba(255, 255, 255, 0.18);
            --text: #f4eeff;
            --text-2: #c9bce0;
            --text-muted: #8d7aae;
            --text-faint: #6c5b8e;
            --accent: #8b6dff;
            --accent-2: #5ad1ff;
            --accent-3: #ff6fb0;
            --glow: rgba(139, 109, 255, 0.45);
            --grid-line: rgba(255, 255, 255, 0.045);
            --shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.85);
            --nav-bg: rgba(8, 7, 13, 0.62);
        }

        [data-theme="light"] {
            color-scheme: light;
            --bg: #f4f1fb;
            --bg-soft: #ece6f7;
            --panel: rgba(255, 255, 255, 0.62);
            --panel-hover: rgba(255, 255, 255, 0.92);
            --border: rgba(124, 92, 255, 0.16);
            --border-strong: rgba(124, 92, 255, 0.34);
            --text: #221433;
            --text-2: #4d3a66;
            --text-muted: #7c6799;
            --text-faint: #a390bf;
            --accent: #6a44e6;
            --accent-2: #1f8fe0;
            --accent-3: #e0458f;
            --glow: rgba(124, 92, 255, 0.30);
            --grid-line: rgba(90, 60, 160, 0.06);
            --shadow: 0 30px 70px -34px rgba(110, 70, 180, 0.40);
            --nav-bg: rgba(244, 241, 251, 0.70);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--nav-h);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-font-smoothing: antialiased;
            transition: background 0.4s ease, color 0.4s ease;
        }
        /* 去除移动端点击高亮；交互元素统一用 :active 反馈代替（见「触屏反馈」段） */
        a, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        /* ========== 背景层 ========== */
        .bg-fx {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-fx::before {
            content: "";
            position: absolute;
            inset: -30%;
            background:
                radial-gradient(40vw 40vw at 12% 8%, var(--glow), transparent 60%),
                radial-gradient(38vw 38vw at 88% 18%, rgba(90, 209, 255, 0.30), transparent 60%),
                radial-gradient(46vw 46vw at 70% 96%, rgba(255, 111, 176, 0.26), transparent 62%);
            filter: blur(20px);
            opacity: 0.9;
            animation: floatGlow 24s ease-in-out infinite alternate;
        }
        .bg-fx::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 50% 35%, #000 0%, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at 50% 35%, #000 0%, transparent 78%);
        }
        @keyframes floatGlow {
            0% { transform: translate3d(0,0,0) scale(1); }
            100% { transform: translate3d(2%, -3%, 0) scale(1.08); }
        }

        /* ========== 动态：滚动进度 + 光标光晕 ========== */
        .progress {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
            z-index: 60;
            transition: width 0.1s linear;
        }
        .cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 540px; height: 540px;
            margin: -270px 0 0 -270px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow), transparent 62%);
            opacity: 0.5;
            pointer-events: none;
            z-index: -1;
            will-change: transform;
            transition: opacity 0.3s ease;
        }
        @media (hover: none) { .cursor-glow { display: none; } }

        /* ========== 导航 ========== */
        .nav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px clamp(18px, 5vw, 56px);
            padding-left: max(clamp(18px, 5vw, 56px), env(safe-area-inset-left));
            padding-right: max(clamp(18px, 5vw, 56px), env(safe-area-inset-right));
            background: var(--nav-bg);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .nav.scrolled { border-bottom-color: var(--border); }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: var(--text);
            text-decoration: none;
        }
        .brand .mark {
            width: 34px; height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            box-shadow: 0 6px 18px -6px var(--glow);
        }

        .nav-links { display: flex; align-items: center; gap: 6px; }
        .nav-links a {
            position: relative;
            padding: 8px 14px;
            font-size: 14.5px;
            color: var(--text-2);
            text-decoration: none;
            border-radius: 10px;
            transition: color 0.25s ease, background 0.25s ease;
        }
        .nav-links a:hover { color: var(--text); background: var(--panel); }
        .nav-links a.active { color: var(--text); }
        .nav-links a::after {
            content: "";
            position: absolute;
            left: 14px; right: 14px; bottom: 2px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transform: scaleX(0);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(.16,1,.3,1), opacity 0.3s ease;
        }
        .nav-links a.active::after { transform: scaleX(1); opacity: 1; }

        .nav-right { display: flex; align-items: center; gap: 10px; }
        .theme-toggle {
            width: 40px; height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--text-2);
            cursor: pointer;
            font-size: 17px;
            transition: transform 0.3s cubic-bezier(.22,1,.36,1), color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }
        .theme-toggle:hover { color: var(--text); border-color: var(--border-strong); transform: translateY(-1px); }

        /* 移动端汉堡按钮（仅小屏显示） */
        .nav-toggle {
            display: none;
            width: 40px; height: 40px;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--text-2);
            cursor: pointer;
            font-size: 17px;
            transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }
        .nav-toggle:hover { color: var(--text); border-color: var(--border-strong); }

        /* 移动端下拉菜单 */
        .mobile-menu {
            position: fixed;
            top: var(--nav-h); left: 0; right: 0;
            z-index: 49;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px clamp(18px, 5vw, 56px) 18px;
            padding-left: max(clamp(18px, 5vw, 56px), env(safe-area-inset-left));
            padding-right: max(clamp(18px, 5vw, 56px), env(safe-area-inset-right));
            background: var(--nav-bg);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border-bottom: 1px solid var(--border);
            opacity: 0;
            transform: translateY(-12px);
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(.16,1,.36,1), visibility 0s linear 0.3s;
        }
        .mobile-menu.open {
            opacity: 1; transform: none; pointer-events: auto; visibility: visible;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(.16,1,.36,1), visibility 0s;
        }
        .mobile-menu a {
            padding: 13px 14px;
            font-size: 16px;
            color: var(--text-2);
            text-decoration: none;
            border-radius: 12px;
            transition: color 0.2s ease, background 0.2s ease;
        }
        .mobile-menu a:hover,
        .mobile-menu a.active { color: var(--text); background: var(--panel); }

        /* ========== 通用容器 ========== */
        .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 clamp(18px, 5vw, 56px); }
        section { scroll-margin-top: calc(var(--nav-h) + 16px); }

        /* ========== Hero ========== */
        .hero {
            position: relative;
            min-height: calc(100vh - var(--nav-h));
            min-height: calc(100svh - var(--nav-h));
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            align-items: center;
            gap: clamp(28px, 5vw, 72px);
            padding: clamp(40px, 8vh, 96px) 0;
        }
        .hero h1 {
            font-size: clamp(40px, 7vw, 76px);
            font-weight: 850;
            line-height: 1.04;
            letter-spacing: -1.5px;
            margin: 22px 0 18px;
        }
        .hero h1 .grad {
            background: linear-gradient(110deg, var(--accent) 0%, var(--accent-2) 45%, var(--accent-3) 70%, var(--accent) 100%);
            background-size: 220% 220%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: gradShift 7s ease-in-out infinite;
        }
        @keyframes gradShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .cta { display: flex; flex-wrap: wrap; gap: 14px; }

        /* Hero 入场动画（仅加载时播放一次，带错落延迟） */
        @keyframes heroIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: none; }
        }
        .hero-copy > * { animation: heroIn 0.9s cubic-bezier(.16,1,.36,1) both; }
        .hero-copy h1 { animation-delay: 0.15s; }
        .hero-copy .cta { animation-delay: 0.32s; }
        .hero-visual { animation: heroIn 1s cubic-bezier(.16,1,.36,1) 0.22s both; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 24px;
            font-size: 15px;
            font-weight: 650;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            /* 更柔的缓动：接近用短缓动跟手，离开用长缓动回弹，避免「啪」地弹起 */
            transition: transform 0.3s cubic-bezier(.22,1,.36,1), box-shadow 0.35s ease, background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            will-change: transform;
        }
        .btn-primary {
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            box-shadow: 0 14px 34px -12px var(--glow);
        }
        /* hover 仅作兜底（无 JS / 触屏时）；实际跟手位移由磁力脚本接管 */
        .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 22px 46px -12px var(--glow); }
        .btn-ghost {
            color: var(--text);
            background: var(--panel);
            border-color: var(--border);
        }
        .btn-ghost:hover { transform: translateY(-3px) scale(1.02); border-color: var(--border-strong); background: var(--panel-hover); }

        /* Hero 视觉块 */
        .hero-visual {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            border: 1px solid var(--border);
            background:
                radial-gradient(120% 120% at 20% 10%, rgba(139,109,255,0.20), transparent 55%),
                radial-gradient(120% 120% at 90% 90%, rgba(90,209,255,0.18), transparent 55%),
                var(--bg-soft);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: grid;
            place-items: center;
        }
        .mono {
            font-size: clamp(96px, 22vw, 200px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent-2) 55%, var(--accent-3));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 18px 40px var(--glow));
            animation: floatMono 6s ease-in-out infinite;
            position: relative;
            z-index: 2; /* 无J 位于三体之上，作中心焦点 */
        }
        @keyframes floatMono {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-14px) rotate(2deg); }
        }
        /* 三体运动画布：3D 引力模拟（figure-eight 解）+ 透视投影，取代原虚线轨道 */
        .orbit3d {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            z-index: 1;
        }

        /* 向下滚动指示器 */
        .scroll-hint {
            position: absolute;
            left: 50%; bottom: 10px;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-decoration: none;
            opacity: 0;
            animation: hintIn 0.8s ease 1.1s both;
        }
        .scroll-hint span { display: inline-block; animation: bob 1.8s ease-in-out infinite; }
        @keyframes hintIn { from { opacity: 0; } to { opacity: 0.9; } }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

        /* ========== 区块标题 ========== */
        .sec-tag {
            font-size: 13px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: var(--accent);
        }
        .sec-head h2 {
            font-size: clamp(28px, 4.5vw, 42px);
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-top: 8px;
        }

        .section-pad { padding: clamp(56px, 10vh, 110px) 0; }

        /* ========== 项目网格 ========== */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }
        .card-project {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 24px;
            border-radius: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(.16,1,.3,1), border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        .card-project::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 80% at 100% 0%, rgba(139,109,255,0.16), transparent 55%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card-project:hover {
            transform: translateY(-6px);
            border-color: var(--border-strong);
            background: var(--panel-hover);
            box-shadow: var(--shadow);
        }
        .card-project:hover::after { opacity: 1; }
        .card-project .p-icon {
            width: 52px; height: 52px;
            display: grid; place-items: center;
            font-size: 26px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            box-shadow: 0 10px 24px -10px var(--glow);
        }
        .card-project .p-name {
            font-size: 19px; font-weight: 700; color: var(--text);
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .card-project .p-arrow { color: var(--text-faint); transition: transform 0.3s ease, color 0.3s ease; }
        .card-project:hover .p-arrow { transform: translate(4px, -4px); color: var(--accent); }
        .card-project .p-desc { font-size: 14px; color: var(--text-muted); }
        .card-project .p-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
        .p-tag {
            font-size: 11.5px;
            padding: 4px 10px;
            border-radius: 100px;
            color: var(--text-2);
            background: var(--bg-soft);
            border: 1px solid var(--border);
        }
        .card-project .p-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: auto;
            padding-top: 4px;
            font-size: 12.5px;
            color: var(--text-faint);
        }
        .p-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
        .empty-note { text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 28px; }

        /* ========== 联系 ========== */
        .contact {
            text-align: center;
            border-radius: 28px;
            border: 1px solid var(--border);
            background:
                radial-gradient(120% 140% at 50% 0%, rgba(139,109,255,0.16), transparent 60%),
                var(--panel);
            padding: clamp(40px, 7vw, 72px) 24px;
        }
        .contact h2 { font-size: clamp(28px, 5vw, 46px); font-weight: 850; letter-spacing: -1px; }
        .contact p { color: var(--text-2); margin: 14px auto 28px; max-width: 46ch; }
        .contact .cta { justify-content: center; }

        /* ========== 页脚 ========== */
        .footer {
            margin-top: 40px;
            border-top: 1px solid var(--border);
            padding: clamp(36px, 6vh, 60px) 0 44px;
        }
        .footer-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }
        .f-brand p { color: var(--text-muted); font-size: 13.5px; margin-top: 10px; }
        .f-links { display: flex; flex-wrap: wrap; gap: 4px; }
        .f-links a {
            padding: 8px 12px;
            font-size: 14px;
            color: var(--text-2);
            text-decoration: none;
            border-radius: 10px;
            transition: color 0.2s ease, background 0.2s ease;
        }
        .f-links a:hover { color: var(--text); background: var(--panel); }

        /* ========== 回到顶部按钮 ========== */
        .to-top {
            position: fixed;
            right: max(clamp(16px, 3vw, 28px), env(safe-area-inset-right));
            bottom: max(clamp(16px, 3vw, 28px), env(safe-area-inset-bottom));
            width: 48px; height: 48px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 14px 34px -12px var(--glow);
            opacity: 0;
            transform: translateY(16px) scale(0.9);
            pointer-events: none;
            z-index: 55;
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.22,1,.36,1), box-shadow 0.3s ease;
        }
        .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
        .to-top:hover { box-shadow: 0 22px 46px -12px var(--glow); }

        /* ========== 滚动揭示 ========== */
        .reveal { opacity: 0; }
        .reveal.in { animation: revealIn 0.8s cubic-bezier(.16,1,.36,1) both; will-change: opacity, transform; }
        @keyframes revealIn {
            from { opacity: 0; transform: translateY(26px) scale(0.985); }
            to   { opacity: 1; transform: none; }
        }

        /* ========== 键盘焦点可见（无障碍）========== */
        :focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 3px;
            border-radius: 8px;
        }

        /* ========== 触屏反馈（手机操作逻辑） ========== */
        /* 触屏设备：禁用仅 hover 的位移/倾斜，避免点击后「粘滞 hover」 */
        @media (hover: none) {
            .card-project:hover { transform: none; box-shadow: none; background: var(--panel); }
            .btn-primary:hover,
            .btn-ghost:hover { transform: none; }
            .nav-links a:hover { color: var(--text-2); background: transparent; }
        }

    <script>
        // 主题切换：首屏主题已由 <head> 内联脚本定好，这里接管按钮与偏好
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            function apply(t) {
                root.setAttribute('data-theme', t);
                btn.textContent = t === 'dark' ? '🌙' : '☀️';
            }
            apply(root.getAttribute('data-theme') || 'dark'); // 同步按钮图标
            btn.addEventListener('click', function () {
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                apply(next);
                try { localStorage.setItem('wj-theme', next); } catch (e) {}
            });
            // 仅在用户未手动设定时跟随系统切换
            mql.addEventListener('change', function (e) {
                if (!localStorage.getItem('wj-theme')) apply(e.matches ? 'dark' : 'light');

        })();

        // 导航栏滚动描边（统一在 onScroll 中处理）

        // 滚动揭示

        }, { threshold: 0.12 });
        // 项目卡片错落出现（仅作用于入场动画，不影响悬浮过渡）
        document.querySelectorAll('.card-project').forEach(function (el, i) {
            el.style.animationDelay = (i * 90) + 'ms';
        });
        document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });

        // 导航高亮（桌面链接 + 移动菜单同步）
        var sections = ['top', 'projects', 'contact'].map(function (id) { return document.getElementById(id); });
        var links = document.querySelectorAll('.nav-links a, .mobile-menu a');
        var spy = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) {
                    links.forEach(function (l) {
                        var on = l.getAttribute('href') === '#' + e.target.id;
                        l.classList.toggle('active', on);
                        if (on) { l.setAttribute('aria-current', 'page'); }
                        else { l.removeAttribute('aria-current'); }

        }, { rootMargin: '-45% 0px -50% 0px' });

        // 末屏兜底：滚到页面底部时高亮「联系」（最后一个区块太矮，进不了判定带）
        function syncContactActive() {
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
                links.forEach(function (l) {
                    var on = l.getAttribute('href') === '#contact';
                    l.classList.toggle('active', on);

        // 移动端汉堡菜单
        var navToggle = document.getElementById('navToggle');
        var mobileMenu = document.getElementById('mobileMenu');
        function setMenu(open) {
            mobileMenu.classList.toggle('open', open);
            navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            navToggle.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
            navToggle.textContent = open ? '✕' : '☰';
        }
        navToggle.addEventListener('click', function () {
            setMenu(!mobileMenu.classList.contains('open'));
        });
        mobileMenu.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () { setMenu(false); });
        });
        document.addEventListener('click', function (e) {
            if (mobileMenu.classList.contains('open') &&
                !mobileMenu.contains(e.target) && !navToggle.contains(e.target)) {
                setMenu(false);
            }
        });

        // 滚动进度条
        var progressEl = document.getElementById('progress');
        function updateProgress() {
            var h = document.documentElement.scrollHeight - window.innerHeight;
            progressEl.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
        }

        // 光标光晕 + 卡片 3D 倾斜 + 按钮磁力：强制开启，忽略系统「减弱动效」偏好
        // 仅由设备是否支持 hover 决定（触屏不跑，避免按钮漂移），不再受 reduceMotion 影响
        var canHover = window.matchMedia('(hover: hover)').matches;
        var cursorGlow = document.getElementById('cursorGlow');
        if (canHover) {
            window.addEventListener('pointermove', function (e) {
                cursorGlow.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
            }, { passive: true });

            document.querySelectorAll('.card-project').forEach(function (card) {
                // 进入时：极短过渡做轻微平滑，让倾斜跟手而不橡皮感
                card.addEventListener('pointerenter', function () {
                    card.style.transition = 'transform 0.12s ease-out';
                });
                card.addEventListener('pointermove', function (e) {
                    var r = card.getBoundingClientRect();
                    var px = (e.clientX - r.left) / r.width - 0.5;
                    var py = (e.clientY - r.top) / r.height - 0.5;
                    card.style.transform = 'perspective(800px) rotateY(' + (px * 8).toFixed(2) + 'deg) rotateX(' + (-py * 8).toFixed(2) + 'deg) translateY(-6px)';
                });
                // 离开时：换回平滑缓动，自然回弹归位
                card.addEventListener('pointerleave', function () {
                    card.style.transition = 'transform 0.6s cubic-bezier(.22,1,.36,1)';
                    card.style.transform = '';
                });
            });

            // 按钮磁力 + 接近感应（连续 lerp 缓动，软跟随，不靠 CSS transition 重启）
            //  ① 光标进入半径（尚未触碰）→ 按钮轻轻迎向光标
            //  ② 进入按钮内 → 彻底跟手
            //  ③ 离开/远离 → 缓动归位
            var magEls = Array.prototype.slice.call(document.querySelectorAll('.btn, .theme-toggle'));
            var RADIUS = 180;       // 接近感应半径(px)
            var MAX_PULL = 10;      // 接近时最大迎向位移(px)
            var SPEED = 60;         // 光标跟随：px/秒，线性匀速
            var LIFT_DUR = 0.55;    // 弹起时长(秒)：ease-out 缓动，越大越慢越柔
            var SPEED_S = 0.5;      // scale：每秒变化量
            var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); }; // easeOutCubic
            magEls.forEach(function (el) {
                // transform 由 rAF 逐帧缓动接管，去掉 transition 里的 transform，避免双重缓动打架
                el.style.transition = 'box-shadow 0.4s ease, background 0.35s ease, border-color 0.35s ease, color 0.35s ease';
                el._x = 0; el._y = 0; el._plift = 0; el._s = 1;
                el._tx = 0; el._ty = 0; el._ts = 1;
                el._liftP = 0; el._liftFrom = 0; el._liftTo = 0; el._liftT0 = 0; // 弹起缓动进度
                el._inside = false;
                var s = el.classList.contains('theme-toggle') ? 0.18 : 0.3;
                el.addEventListener('pointerenter', function () {
                    el._inside = true; el._plift = 0;
                    el._liftFrom = el._liftP; el._liftTo = 1; el._liftT0 = performance.now();
                });
                el.addEventListener('pointermove', function (e) {
                    if (!el._inside) return;
                    var r = el.getBoundingClientRect();
                    el._tx = (e.clientX - (r.left + r.width / 2)) * s;   // 跟随光标横向
                    el._ty = (e.clientY - (r.top + r.height / 2)) * s;  // 跟随光标纵向
                    el._ts = 1.03;
                });
                el.addEventListener('pointerleave', function () {
                    el._inside = false; el._tx = 0; el._ty = 0; el._ts = 1;
                    el._liftFrom = el._liftP; el._liftTo = 0; el._liftT0 = performance.now();
                });
            });

            var pmx = 0, pmy = 0, lastPointerMove = -1e9;
            window.addEventListener('pointermove', function (e) {
                pmx = e.clientX; pmy = e.clientY;
                lastPointerMove = performance.now();
                if (!running) wake();
            }, { passive: true });

            // 空闲休眠：指针静止且所有元素已归位时停止 rAF，降低空闲 CPU
            var running = false, rafId = 0;
            function wake() {
                if (running) return;
                running = true; last = 0;
                rafId = requestAnimationFrame(tick);
            }

            // 跟随用基于时间的匀速（刷新率无关）；弹起用 ease-out 缓动（有"落位"的动画感）
            var last = 0;
            function tick(now) {
                if (!last) last = now;
                var dt = (now - last) / 1000;
                last = now;
                if (dt > 0.05) dt = 0.05;            // 卡顿/切后台时钳制，避免跳变
                var stepF = SPEED * dt;              // 本帧跟随步长
                var stepS = SPEED_S * dt;            // 本帧 scale 步长
                for (var i = 0; i < magEls.length; i++) {
                    var el = magEls[i];
                    // 弹起缓动（ease-out）：不再匀速机械，有减速落位感
                    if (el._liftP !== el._liftTo) {
                        var lt = (now - el._liftT0) / 1000 / LIFT_DUR;
                        if (lt >= 1) { el._liftP = el._liftTo; }
                        else { el._liftP = el._liftFrom + (el._liftTo - el._liftFrom) * easeOut(lt); }
                    }
                    if (!el._inside) {
                        var r = el.getBoundingClientRect();
                        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                        var dx = pmx - cx, dy = pmy - cy;
                        var dist = Math.hypot(dx, dy);
                        var edge = dist - Math.hypot(r.width / 2, r.height / 2); // 到边缘的最近距离
                        if (edge < RADIUS && edge > -24 && dist > 0.001) {
                            var t = Math.max(0, 1 - Math.max(0, edge) / RADIUS); // 0→1 越近越强
                            var pull = t * MAX_PULL * 0.6;
                            el._tx = dx / dist * pull;   // 迎向光标
                            el._ty = dy / dist * pull;
                            el._plift = -2 * t;          // 靠近时轻微弹起
                            el._ts = 1 + 0.02 * t;
                        } else { el._tx = 0; el._ty = 0; el._plift = 0; el._ts = 1; }
                    }
                    // 光标跟随：线性匀速（按 dt 缩放，刷新率无关）
                    var ddx = el._tx - el._x, ddy = el._ty - el._y;
                    var dd = Math.hypot(ddx, ddy);
                    if (dd <= stepF) { el._x = el._tx; el._y = el._ty; }
                    else { el._x += ddx / dd * stepF; el._y += ddy / dd * stepF; }
                    // scale：线性
                    var ds = el._ts - el._s;
                    if (Math.abs(ds) <= stepS) { el._s = el._ts; }
                    else { el._s += (ds > 0 ? 1 : -1) * stepS; }
                    var totalLift = -3 * el._liftP + el._plift;
                    if (el._x === 0 && el._y === 0 && el._liftP === 0 && el._plift === 0 && el._s === 1) {
                        el.style.transform = '';
                    } else {
                        el.style.transform = 'translate(' + el._x.toFixed(2) + 'px,' + (el._y + totalLift).toFixed(2) + 'px) scale(' + el._s.toFixed(3) + ')';
                    }
                }
                // 指针刚动过 → 继续；否则判断是否都已归位，可休眠
                var active = (now - lastPointerMove) < 120;
                if (!active) {
                    for (var k = 0; k < magEls.length; k++) {
                        var m = magEls[k];
                        if (m._x !== m._tx || m._y !== m._ty || m._s !== m._ts || m._liftP !== m._liftTo) { active = true; break; }
                    }
                }
                if (active) { rafId = requestAnimationFrame(tick); }
                else { running = false; }
            }
            wake();
        }

        // 回到顶部按钮：滚动一定距离后浮现（统一在 onScroll 中处理）
        var toTop = document.getElementById('toTop');
        // 回到顶部：加速（ease-in）滚动——先慢后快，越接近顶部越快
        function scrollToTopLinear() {
            var startY = window.scrollY;
            if (startY <= 0) return;
            var dur = Math.min(900, Math.max(300, startY * 0.4)); // 距离越远略久，但有界（短页 300ms、长页封顶 900ms）
            var startTime = null;
            function step(now) {
                if (startTime === null) startTime = now;
                var t = Math.min((now - startTime) / dur, 1);
                var eased = t * t; // ease-in：进度先慢后快，呈现加速上滑
                // 强制 behavior:'instant' 瞬时定位：'auto' 会继承 html{scroll-behavior:smooth}，
                // 导致每帧又被平滑化一次，加速节奏被覆盖、看起来仍是一瞬到顶
                window.scrollTo({ top: startY * (1 - eased), left: 0, behavior: 'instant' });
                if (t < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }
        toTop.addEventListener('click', function () {
            scrollToTopLinear();
        });

        // 统一滚动处理（rAF 节流：单次滚动只触发一帧，合并描边/进度/回到顶部/导航高亮）
        var _ticking = false;
        function onScroll() {
            if (_ticking) return;
            _ticking = true;
            requestAnimationFrame(function () {
                var y = window.scrollY;
                nav.classList.toggle('scrolled', y > 12);
                toTop.classList.toggle('show', y > 600);
                updateProgress();
                syncContactActive();
                _ticking = false;
            });
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        // ========== 三体运动（3D 引力模拟 + 透视投影） ==========
        // 采用经典的 figure-eight（8 字）周期解作基础动力学，再对平面做缓慢 3D 旋转，
        // 配合透视投影 → 三颗发光星体在三维空间里绕飞，带拖尾与引力三角网。
        (function () {
            var canvas = document.getElementById('threeBody');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var host = canvas.parentElement;
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var W = 0, H = 0;
            function resize() {
                var r = host.getBoundingClientRect();
                var s = Math.max(1, Math.min(r.width, r.height));
                W = s; H = s;
                canvas.width = Math.round(s * dpr);
                canvas.height = Math.round(s * dpr);
                canvas.style.width = s + 'px';
                canvas.style.height = s + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            var colors = ['#8b6dff', '#5ad1ff', '#ff6fb0']; // accent / accent-2 / accent-3
            var G = 1, SUB_H = 0.004, SPEED = 0.55, TRAIL = 24;
            // figure-eight 初始条件（归一化单位，等质量，G=1）
            var bodies = [
                { x: 0.97000436, y: -0.24308753, z: 0, vx: 0.466203685, vy: 0.43236573, vz: 0, m: 1, c: colors[0] },
                { x: -0.97000436, y: 0.24308753, z: 0, vx: 0.466203685, vy: 0.43236573, vz: 0, m: 1, c: colors[1] },
                { x: 0, y: 0, z: 0, vx: -0.93240737, vy: -0.86473146, vz: 0, m: 1, c: colors[2] }
            ];
            var trail = [[], [], []];

            function accel() {
                var a = [{ x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }];
                for (var i = 0; i < 3; i++) {
                    for (var j = 0; j < 3; j++) {
                        if (i === j) continue;
                        var dx = bodies[j].x - bodies[i].x,
                            dy = bodies[j].y - bodies[i].y,
                            dz = bodies[j].z - bodies[i].z;
                        var d2 = dx * dx + dy * dy + dz * dz;
                        var inv = 1 / Math.sqrt(d2);
                        var f = G * bodies[j].m * inv * inv * inv; // G*m/d^3
                        a[i].x += f * dx; a[i].y += f * dy; a[i].z += f * dz;
                    }
                }
                return a;
            }
            function verlet(h) {
                var a0 = accel();
                for (var i = 0; i < 3; i++) {
                    bodies[i].x += bodies[i].vx * h + 0.5 * a0[i].x * h * h;
                    bodies[i].y += bodies[i].vy * h + 0.5 * a0[i].y * h * h;
                    bodies[i].z += bodies[i].vz * h + 0.5 * a0[i].z * h * h;
                }
                var a1 = accel();
                for (var i = 0; i < 3; i++) {
                    bodies[i].vx += 0.5 * (a0[i].x + a1[i].x) * h;
                    bodies[i].vy += 0.5 * (a0[i].y + a1[i].y) * h;
                    bodies[i].vz += 0.5 * (a0[i].z + a1[i].z) * h;
                }
            }
            function hexA(hex, a) {
                var n = parseInt(hex.slice(1), 16);
                return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
            }

            var simTime = 0, last = 0, rafOn = false, visible = true;
            function step(now) {
                if (!visible) { rafOn = false; return; }
                if (!last) last = now;
                var rdt = Math.min((now - last) / 1000, 0.033); last = now;
                var adv = SPEED * rdt;
                var n = Math.max(1, Math.round(adv / SUB_H));
                var h = adv / n;
                for (var s = 0; s < n; s++) { verlet(h); simTime += h; }
                draw();
                requestAnimationFrame(step);
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                var ax = 1.0 + 0.22 * Math.sin(simTime * 0.15), ay = simTime * 0.35;
                var cyr = Math.cos(ay), syr = Math.sin(ay), cxr = Math.cos(ax), sxr = Math.sin(ax);
                var S = W * 0.24, camZ = 3.2;
                var proj = [];
                for (var i = 0; i < 3; i++) {
                    var b = bodies[i];
                    // 绕 Y 轴旋转
                    var x1 = b.x * cyr + b.z * syr, z1 = -b.x * syr + b.z * cyr, y1 = b.y;
                    // 绕 X 轴旋转
                    var y2 = y1 * cxr - z1 * sxr, z2 = y1 * sxr + z1 * cxr, x2 = x1;
                    var persp = camZ / (camZ - z2);
                    proj.push({
                        x: W / 2 + x2 * S * persp,
                        y: H / 2 + y2 * S * persp,
                        r: Math.max(2, W * 0.05 * persp),
                        depth: z2, c: b.c
                    });
                }
                // 拖尾
                for (var i = 0; i < 3; i++) {
                    trail[i].push({ x: proj[i].x, y: proj[i].y });
                    if (trail[i].length > TRAIL) trail[i].shift();
                }
                ctx.globalCompositeOperation = 'lighter';
                for (var i = 0; i < 3; i++) {
                    var tp = trail[i];
                    for (var t = 1; t < tp.length; t++) {
                        var a = (t / tp.length) * 0.5;
                        ctx.strokeStyle = hexA(bodies[i].c, a * 0.5);
                        ctx.lineWidth = Math.max(1, proj[i].r * 0.5 * (t / tp.length));
                        ctx.beginPath();
                        ctx.moveTo(tp[t - 1].x, tp[t - 1].y);
                        ctx.lineTo(tp[t].x, tp[t].y);
                        ctx.stroke();
                    }
                }
                // 引力三角网（淡）
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(proj[0].x, proj[0].y);
                ctx.lineTo(proj[1].x, proj[1].y);
                ctx.lineTo(proj[2].x, proj[2].y);
                ctx.closePath();
                ctx.stroke();
                // 天体（按深度排序，远的先画）
                var order = [0, 1, 2].sort(function (a, b) { return proj[a].depth - proj[b].depth; });
                for (var k = 0; k < 3; k++) {
                    var p = proj[order[k]];
                    var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4);
                    g.addColorStop(0, hexA(p.c, 0.95));
                    g.addColorStop(0.35, hexA(p.c, 0.5));
                    g.addColorStop(1, hexA(p.c, 0));
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * 2.4, 0, 6.2832);
                    ctx.fill();
                    ctx.fillStyle = hexA(p.c, 0.95);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * 0.55, 0, 6.2832);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
            }

            // 仅在 Hero 可视时运行，离开视口暂停，省 CPU
            if ('IntersectionObserver' in window) {
                new IntersectionObserver(function (es) {
                    visible = es[0].isIntersecting;
                    if (visible && !rafOn) { rafOn = true; last = 0; requestAnimationFrame(step); }
                }, { threshold: 0 }).observe(host);
            } else {
                rafOn = true; requestAnimationFrame(step);
            }
        })();
    </script>
</body>
</html>
