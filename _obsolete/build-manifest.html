<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生成音乐清单 manifest.json</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: linear-gradient(145deg, #f7f0fc 0%, #e9def5 100%);
            padding: 16px;
            color: #2d1b3e;
        }
        .card {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 30px 60px -20px rgba(90, 60, 120, 0.25);
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 14px; line-height: 1.7; color: #4d3a62; margin-bottom: 18px; }
        code { background: rgba(160, 118, 204, 0.18); padding: 1px 6px; border-radius: 4px; }
        .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
        button {
            border: none;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #c4a0e8, #a076cc);
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(160, 118, 204, 0.25);
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.05); }
        button:active { transform: scale(0.97); }
        pre {
            background: rgba(45, 27, 62, 0.06);
            border: 1px solid rgba(160, 118, 204, 0.2);
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 60px;
            color: #4d3a62;
        }
        .hint { font-size: 12px; color: #8a75a8; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎵 生成 music/manifest.json</h1>
        <p>
            选择你的 <code>music</code> 文件夹（里面放音频文件）。页面会在<strong>本地</strong>读取所有音频文件，
            生成 <code>manifest.json</code> 并直接写回该文件夹。<br />
            若浏览器不支持直接写文件夹，则改为下载 <code>manifest.json</code>，你手动放进 <code>music/</code> 即可。
        </p>
        <div class="btns">
            <button id="pickDir">① 选择 music 文件夹</button>
            <button id="pickFiles">② 或选择多个音频文件</button>
        </div>
        <pre id="log">点击上方按钮开始…</pre>
        <p class="hint">
            提示：请通过本地服务器 / 预览地址打开本页（如 http://127.0.0.1 或 localhost），
            不要直接双击用 file:// 打开，否则浏览器会禁止读写文件夹。
        </p>
    </div>

    <script>
        const AUDIO_EXT = ['.mp3', '.m4a', '.aac', '.ogg', '.oga', '.wav', '.flac', '.opus', '.webm'];
        const logEl = document.getElementById('log');

        function log(s) { logEl.textContent += s + '\n'; }
        function isAudio(name) {
            const i = name.lastIndexOf('.');
            return i >= 0 && AUDIO_EXT.includes(name.slice(i).toLowerCase());
        }

        async function writeManifest(names, dirHandle) {
            const list = names.filter(isAudio).sort();
            const json = JSON.stringify(list, null, 2) + '\n';
            if (dirHandle && dirHandle.getFileHandle && dirHandle.getFileHandle.constructor) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('manifest.json', { create: true });
                    const w = await fileHandle.createWritable();
                    await w.write(json);
                    await w.close();
                    log('✅ 已直接写入文件夹内的 manifest.json，共 ' + list.length + ' 个音频：');
                } catch (e) {
                    log('⚠️ 直接写入失败（' + e.message + '），改为下载文件。');
                    download(json);
                }
            } else {
                download(json);
            }
            list.forEach(function (n) { log('  - ' + n); });
            if (list.length === 0) log('（没找到音频文件，请确认选对了文件夹/文件）');
        }

        function download(text) {
            const blob = new Blob([text], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'manifest.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            log('⬇️ 已下载 manifest.json，请把它放进 music/ 文件夹。');
        }

        document.getElementById('pickDir').addEventListener('click', async function () {
            logEl.textContent = '';
            if (!window.showDirectoryPicker) {
                log('当前浏览器不支持"选择文件夹"直写功能，请用按钮②（选择多个音频文件，会下载 manifest.json）。');
                return;
            }
            try {
                const dir = await window.showDirectoryPicker();
                const names = [];
                for await (const [, handle] of dir.entries()) {
                    if (handle.kind === 'file') {
                        // handle.name 在 FileSystemFileHandle 上可用
                        names.push(handle.name);
                    }
                }
                await writeManifest(names, dir);
            } catch (e) {
                log('已取消或出错：' + e.message);
            }
        });

        document.getElementById('pickFiles').addEventListener('click', function () {
            logEl.textContent = '';
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = AUDIO_EXT.join(',');
            input.addEventListener('change', function () {
                const names = Array.prototype.map.call(input.files, function (f) { return f.name; });
                writeManifest(names, null);
            });
            input.click();
        });
    </script>
</body>
</html>
